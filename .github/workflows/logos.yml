name: Chercher les logos des enseignes

on:
  workflow_dispatch:        # lancement manuel seulement
    inputs:
      sites:
        description: "Sites à visiter, ex. « geant=https://www.geant.tn/ » (vide = enseignes suivies)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: maj-prix
  cancel-in-progress: false

jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger les logos depuis les sites des enseignes
        env:
          SITES: ${{ inputs.sites }}
        run: python tools/chercher_logos.py
      - name: Enregistrer les fichiers trouvés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logos/brut/
          if git diff --cached --quiet; then echo "Rien trouvé."; else
            git commit -m "Logos des enseignes : fichiers bruts téléchargés"
            git pull --rebase origin main
            git push
          fi
