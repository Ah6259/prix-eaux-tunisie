name: Mise à jour des prix

on:
  schedule:
    # Tous les jours vers 1h du matin heure de Tunis (UTC+1). Minute décalée
    # (1h07) car GitHub retarde beaucoup les horaires ronds comme :00/:30.
    - cron: "7 0 * * *"
  workflow_dispatch:        # bouton de lancement manuel dans l'onglet Actions

permissions:
  contents: write

concurrency:
  group: maj-prix
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet, nécessaire à build_history.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scraper les prix (Carrefour + Géant Drive + barka.tn)
        run: python tools/collect_prices.py

      - name: Reconstruire l'historique des prix
        run: python tools/build_history.py

      - name: Régénérer les pages par marque et le sitemap
        run: python tools/build_pages.py

      - name: Détecter les baisses de prix et les publier sur Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python tools/price_drops.py

      - name: Publier les nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ assets/img/produits/ marque/ prix-stika/ quelle-eau/ video/ sitemap.xml index.html
          if git diff --cached --quiet; then
            echo "Aucun changement de prix aujourd'hui."
          else
            git commit -m "Mise à jour automatique des prix ($(date -u +%Y-%m-%d))"
            # se resynchroniser d'abord : un commit a pu être poussé pendant le scraping
            git pull --rebase --autostash origin main
            git push
          fi
