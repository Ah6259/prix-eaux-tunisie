name: Mise à jour des prix

on:
  schedule:
    - cron: "30 8 * * *"   # tous les jours à 9h30, heure de Tunis (UTC+1)
  workflow_dispatch:        # bouton de lancement manuel dans l'onglet Actions

permissions:
  contents: write

concurrency:
  group: maj-prix
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scraper les prix (Géant Drive + barka.tn)
        working-directory: tools
        run: |
          rm -rf pages
          python geant_scrape.py
          python barka_scrape.py
          python build_data.py

      - name: Publier les nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement de prix aujourd'hui."
          else
            git commit -m "Mise à jour automatique des prix ($(date -u +%Y-%m-%d))"
            git push
          fi
