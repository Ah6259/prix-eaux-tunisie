name: Debug - acces Otrity (temporaire)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Tester plusieurs facons d'acceder a Otrity
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128 Safari/537.36"
          U="https://otrity.com/wp-json/wc/store/v1/products?category=1261&per_page=100"
          echo "1 UA seul";            curl -s -o /dev/null -w "%{http_code}\n" -A "$UA" "$U"
          echo "2 UA + en-tetes";      curl -s -o /dev/null -w "%{http_code}\n" -A "$UA" -H "Accept: application/json" -H "Accept-Language: fr-FR,fr;q=0.9" -H "Referer: https://otrity.com/categorie-produit/boissons/eaux/" "$U"
          echo "3 page categorie";     curl -s -o /dev/null -w "%{http_code}\n" -A "$UA" "https://otrity.com/categorie-produit/boissons/eaux/"
          echo "4 flux produits";      curl -s -o /dev/null -w "%{http_code}\n" -A "$UA" "https://otrity.com/?post_type=product&product_cat=eaux&feed=rss2"
          echo "5 corps de la reponse 403 :"; curl -s -A "$UA" "$U" | head -c 600; echo
          curl -sI -A "$UA" "$U" | grep -iE "^(server|cf-|x-)" || true
